<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fikr bildirish</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      padding: 20px;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #1e293b;
    }

    .description {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus, textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="form-container">

    <h2>Bizga fikringiz muhim!</h2>

    <p class="description">
      Telefon raqamingiz va fikringizni qoldiring.
    </p>

    <form id="feedbackForm">

      <label for="phone">Telefon raqamingiz</label>

      <input
        type="tel"
        id="phone"
        placeholder="+998901234567"
        required
      >

      <label for="feedback">Sizning fikringiz</label>

      <textarea
        id="feedback"
        placeholder="Fikringizni yozing..."
        required
      ></textarea>

      <button type="submit" id="submitBtn">
        Yuborish
      </button>

      <p id="message"></p>

    </form>

  </div>

  <script>
    const BOT_TOKEN = "8895281536:AAH1JKyRewXvUhIbi1cg7HItCNeecqkif5E";
    const CHAT_ID = "-1003921922451";

    const form = document.getElementById("feedbackForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const phone = document.getElementById("phone").value.trim();
      const feedback = document.getElementById("feedback").value.trim();

      if (!phone || !feedback) {
        message.textContent = "Barcha maydonlarni to'ldiring!";
        message.style.color = "red";
        return;
      }

      const text = `
📩 Yangi fikr!

📱 Telefon: ${phone}

💬 Fikr:
${feedback}
      `;

      submitBtn.disabled = true;
      submitBtn.textContent = "Yuborilmoqda...";

      try {
        const response = await fetch(
          `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: text
            })
          }
        );

        const data = await response.json();

        if (data.ok) {
          message.textContent = "Fikringiz muvaffaqiyatli yuborildi!";
          message.style.color = "green";
          form.reset();
        } else {
          throw new Error(data.description);
        }

      } catch (error) {
        message.textContent = "Xatolik! Qaytadan urinib ko'ring.";
        message.style.color = "red";
        console.error(error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Yuborish";
      }
    });
  </script>

</body>
</html>
